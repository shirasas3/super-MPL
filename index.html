<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hung Man</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/party-js@latest/bundle/party.min.js"></script>
    <script src="code.js" defer></script>
</head>
<body>
    <img src="./assets/media/shoebill (1).png" alt="shoebill" class="shoebill1" id="shoebill1"/>
    <img src="./assets/media/shoebill (2).png" alt="shoebill flying" class="shoebill2" id="shoebill2"/>
    <img src="./assets/media/shoebill (3).png" alt="shoebill eating" class="shoebill3" id="shoebill3"/>
    <img src="./assets/media/shoebill (4).png" alt="shoebill sleeping" class="shoebill4" id="shoebill4"/>
    <img src="./assets/media/shoebill losing.png" alt="shoebill losing" class="shoebill-lost" id="shoebill-lost"/>
    <div id="timer" class="countdown-timer">1:00</div>
    <div id="score" class="score">מילים: 0</div>
    <h1 class="title">ברוכים הבאים לאיש תלוי - גרסת מפ"ל!</h1>
    <div class="toggle">
        <button id="normalBtn" class="active">רגיל</button>
        <button id="timerBtn">נגד הזמן</button>
    </div>
    <div class="paragraph">
        <h2 class="guess" id="guess">תתחיל לנחש!</h2>
        <button class="hintBtn" id="hintBtn">תן רמז קטן</button>
        <p class="hint" id="hint"></p>
    </div>
    <div class="word-paragraph">
        <p class="word" id="word"></p>
        <p class="underlined-word" id="underlined-word"></p>
    </div>
    <div class="keyboard" id="keyboard">
        <div class="row">
            <button class="charBtn">פ</button>
            <button class="charBtn">ם</button>
            <button class="charBtn">ן</button>
            <button class="charBtn">ו</button>
            <button class="charBtn">ט</button>
            <button class="charBtn">א</button>
            <button class="charBtn">ר</button>
            <button class="charBtn">ק</button>
        </div>
        <div class="row">
            <button class="charBtn">ף</button>
            <button class="charBtn">ך</button>
            <button class="charBtn">ל</button>
            <button class="charBtn">ח</button>
            <button class="charBtn">י</button>
            <button class="charBtn">ע</button>
            <button class="charBtn">כ</button>
            <button class="charBtn">ג</button>
            <button class="charBtn">ד</button>
            <button class="charBtn">ש</button>
        </div>
        <div class="row">
            <button class="charBtn">ץ</button>
            <button class="charBtn">ת</button>
            <button class="charBtn">צ</button>
            <button class="charBtn">מ</button>
            <button class="charBtn">נ</button>
            <button class="charBtn">ה</button>
            <button class="charBtn">ב</button>
            <button class="charBtn">ס</button>
            <button class="charBtn">ז</button>
        </div>
    </div>
    <div id="hangman">
        <img src="./assets/media/face.png" id="part1" class="hangman-parts">
        <img src="./assets/media/eye.png" id="part2" class="hangman-parts">
        <img src="./assets/media/eye.png" id="part3" class="hangman-parts">
        <img src="./assets/media/smile.png" id="part4" class="hangman-parts">
        
        <img src="./assets/media/body.png" id="part5" class="hangman-parts">
        <img src="./assets/media/limb.png" id="part6" class="hangman-parts">
        <img src="./assets/media/limb.png" id="part7" class="hangman-parts">
        <img src="./assets/media/limb.png" id="part8" class="hangman-parts">
        <img src="./assets/media/limb.png" id="part9" class="hangman-parts">
    </div>
</body>
</html>
